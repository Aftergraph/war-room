name: Desktop bug
description: Report a reproducible AFTERGRAPH / WAR ROOM Desktop defect
title: "[desktop] "
labels: ["desktop", "bug"]
body:
  - type: input
    id: version
    attributes:
      label: Desktop version
      description: Use the GitHub release/tag version, e.g. desktop-v1.6.10.
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: Executable SHA-256
      description: Paste the EXE hash when available.
  - type: input
    id: windows
    attributes:
      label: Windows version / hardware
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened? Include exact error text without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Affected plane
      options:
        - Desktop shell / UI
        - GitHub observation
        - WORKS / Agent Bridge
        - Persistence / recovery
        - TypeSafe / Jev
        - Assistant / Ollama
        - Service probes
        - Release / installer
        - Other
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials/tokens and sensitive data from this report.
          required: true
        - label: I checked the weakness/risk register for an already-known limitation.
          required: true
