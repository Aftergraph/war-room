name: Home OS v0.14 frontend build

on:
  push:
    branches:
      - homeos/v0.14-frontend-build
    paths:
      - "homeos-v014/real-src.*"
      - ".github/workflows/homeos-v014-frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeos-v014-frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct and verify reviewed frontend source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homeos-v014/work
          cat homeos-v014/real-src.00 homeos-v014/real-src.01 homeos-v014/real-src.02 homeos-v014/real-src.03 > homeos-v014/work/frontend-src.b64
          base64 -d homeos-v014/work/frontend-src.b64 > homeos-v014/work/frontend-src.tgz
          echo "01f1fe0134a295c4179ec538ea46addf82668c60adc301940e1d0753acd81b36  homeos-v014/work/frontend-src.tgz" | sha256sum -c -
          tar -xzf homeos-v014/work/frontend-src.tgz -C homeos-v014
          test -f homeos-v014/Aftergraph.HomeOS.Frontend/package.json
          test -f homeos-v014/Aftergraph.HomeOS.Frontend/vite.config.ts

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Resolve immutable dependency graph
        working-directory: homeos-v014/Aftergraph.HomeOS.Frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependency graph
        working-directory: homeos-v014/Aftergraph.HomeOS.Frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        working-directory: homeos-v014/Aftergraph.HomeOS.Frontend
        run: npm run typecheck

      - name: Lint
        working-directory: homeos-v014/Aftergraph.HomeOS.Frontend
        run: npm run lint

      - name: Unit tests
        working-directory: homeos-v014/Aftergraph.HomeOS.Frontend
        run: npm test

      - name: Production build
        working-directory: homeos-v014/Aftergraph.HomeOS.Frontend
        run: npm run build

      - name: Production bundle audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=homeos-v014/Aftergraph.HomeOS.Frontend
          test -f "$ROOT/dist/index.html"
          test -n "$(find "$ROOT/dist/assets" -type f -name '*.js' -print -quit)"
          test -n "$(find "$ROOT/dist/assets" -type f -name '*.css' -print -quit)"
          if grep -RInE '(localhost|127\.0\.0\.1|http://)' "$ROOT/dist"; then
            echo "Non-production URL found in frontend dist"
            exit 1
          fi
          if ! grep -q "connect-src 'none'" "$ROOT/dist/index.html"; then
            echo "Strict frontend network CSP missing"
            exit 1
          fi
          if grep -RInE '(DEMO|DemoProvider|MockProvider|FakeProvider|placeholder provider|MVP)' "$ROOT/dist"; then
            echo "Non-production runtime marker found in frontend dist"
            exit 1
          fi
          du -ah "$ROOT/dist" | sort -h | tail -20

      - name: Package verified frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          ROOT=homeos-v014/Aftergraph.HomeOS.Frontend
          OUT=homeos-v014/out
          mkdir -p "$OUT"
          cp "$ROOT/package-lock.json" "$OUT/package-lock.json"
          cp -R "$ROOT/dist" "$OUT/dist"
          (cd "$OUT" && find dist -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd "$OUT" && sha256sum package-lock.json >> SHA256SUMS.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeos-v014-frontend-dist
          path: homeos-v014/out
          retention-days: 7
