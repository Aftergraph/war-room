name: BFF verification

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "integrations/**"
      - "security/**"
      - "tests/**"
      - "index.html"
      - "app.js"
      - "algorithms.js"
      - "check.js"
      - "server.js"
      - "styles.css"
      - ".github/workflows/bff-verification.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "integrations/**"
      - "security/**"
      - "tests/**"
      - "index.html"
      - "app.js"
      - "algorithms.js"
      - "check.js"
      - "server.js"
      - "styles.css"
      - ".github/workflows/bff-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bff-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend and BFF syntax gates
        run: |
          node --check app.js
          node --check algorithms.js
          node --check check.js
          node --check server.js
          for f in apps/api/src/server.js packages/*/src/*.js services/*/src/*.js \
                   services/node-bridge/bridge-client.js integrations/*/src/*.js \
                   integrations/telegram/bot-runner.js security/src/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Acceptance suite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/run-all.js
      - name: Self-check
        run: node check.js
      - name: Reusable secret scan
        run: |
          if grep -RIE --exclude-dir=.git --exclude-dir=desktop '(github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|apikey_[A-Za-z0-9_]{24,})' .; then
            echo "Secret-like token found in tracked source"
            exit 1
          fi
