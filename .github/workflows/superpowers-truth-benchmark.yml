name: Superpowers truth benchmark

on:
  push:
    branches:
      - experiment/superpowers-10-task-truth-benchmark
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-and-native-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: JavaScript syntax
        run: node --check desktop/web/app.js
      - name: Desktop Go tests
        working-directory: desktop
        run: go test ./...
